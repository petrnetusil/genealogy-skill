# Template – tools/export_web.py builds nginx.conf from it (answer from data/website.json). Used only for Docker/CapRover deployment.
# Light sign-in: the login page stores a fingerprint (SHA-256) of the answer to the family question in the cookie
# "genealogy" and nginx compares it here. The answer itself is neither here nor in the browser.
# The map key is a 64-character SHA-256 hash – longer than the default bucket (64); without this nginx will not start.
map_hash_bucket_size 128;
map $cookie_genealogy $genealogy_ok {
  default 0;
{{ANSWER}}
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # the login page is always available
  location = /login.html {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location / {
    if ($genealogy_ok = 0) {
      return 401;
    }
    try_files $uri $uri/ =404;
  }

  location ~* \.(jpg|png|svg|css|js|woff2|json|pf_[a-z]+)$ {
    if ($genealogy_ok = 0) {
      return 401;
    }
    expires 30d;
    add_header Cache-Control "private";
  }

  error_page 401 /login.html;
  error_page 404 /404.html;
}
